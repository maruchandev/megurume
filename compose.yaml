services:
  backend:
    build:
      context: ./backend
    working_dir: /workspace/backend
    command: sh -c "while sleep 1000; do :; done"
    volumes:
      - .:/workspace
      - backend_vendor:/workspace/backend/vendor
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: megourmet
      DB_USERNAME: app
      DB_PASSWORD: app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: megourmet
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: localroot
      TZ: Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocalroot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  backend_vendor:
  mysql_data:
